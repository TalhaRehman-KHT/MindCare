# ============================================================
# MindCare — CI (testing only, NEVER deploys)
# Runs on every push to main and every pull request into main/dev.
# ============================================================
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

# A newer push to the same branch cancels the older, still-running CI
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------- Patient app + Admin panel: lint + production build ----------
  web:
    name: Web (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [frontend, admin]
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
        env:
          VITE_BACKEND_URL: https://api.mindcare.us.ci

  # ---------- Node API: install + syntax check + boot smoke test ----------
  backend:
    name: Backend API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --omit=dev --no-audit --no-fund
      - name: Syntax check every JS file
        run: |
          for f in $(git ls-files '*.js' '*.mjs'); do node --check "$f"; done
      - name: Boot smoke test (no real secrets; DB/SMTP errors are expected)
        env:
          PORT: "4000"
          JWT_SECRET: ci-only
          MONGODB_URL: mongodb://127.0.0.1:1/ci
        run: |
          node server.js > server.log 2>&1 &
          for i in $(seq 1 20); do
            curl -fsS http://127.0.0.1:4000/ && exit 0
            sleep 1
          done
          echo "API did not start:"; cat server.log; exit 1

  # ---------- MindAI (FastAPI): install + import + /health ----------
  ai:
    name: MindAI service
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Start and check /health (dummy key, no LLM call)
        env:
          GROQ_API_KEY: ci-dummy-key
        run: |
          uvicorn chatbot.main:app --host 127.0.0.1 --port 5000 > ai.log 2>&1 &
          for i in $(seq 1 20); do
            curl -fsS http://127.0.0.1:5000/health && exit 0
            sleep 1
          done
          echo "MindAI did not start:"; cat ai.log; exit 1

  # ---------- All 4 Dockerfiles must build (nothing is pushed) ----------
  docker:
    name: Docker build (${{ matrix.name }})
    runs-on: ubuntu-latest
    needs: [web, backend, ai]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: frontend, context: frontend, file: frontend/Dockerfile }
          - { name: admin, context: admin, file: admin/Dockerfile }
          - { name: backend, context: backend, file: backend/Dockerfile }
          - { name: ai, context: backend, file: backend/Dockerfile.ai }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: false
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
