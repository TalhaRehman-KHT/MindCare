# ============================================================
# MindCare — Deploy (production)
#
# Flow:  push/merge into `dev`
#          → 1. tests (the same CI as main)
#          → 2. ⏸  waits for YOUR approval (environment: production)
#          → 3. builds 4 images and uploads them to GHCR with tag :stable
#          → 4. the home server pulls :stable by itself (systemd timer)
#
# Nothing is uploaded before approval. GitHub never connects to the server.
# Rollback: open an older successful run of this workflow → "Re-run all jobs" → approve.
# ============================================================
name: Deploy

on:
  push:
    branches: [dev]
  workflow_dispatch: {}

permissions:
  contents: read

# One deployment at a time; a new one waits instead of cancelling the running one
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # ---------- 1. Tests (reuses ci.yml) ----------
  test:
    name: Tests
    uses: ./.github/workflows/ci.yml

  # ---------- 2 + 3. Approval, then build & upload ----------
  publish:
    name: Approve & publish images
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://mindcare.us.ci
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Image names (GHCR needs lowercase)
        run: |
          echo "REGISTRY=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
          echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Frontend (patient app)
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/Dockerfile
          push: true
          build-args: |
            VITE_BACKEND_URL=${{ vars.VITE_BACKEND_URL }}
            VITE_ADMIN_PANEL_URL=${{ vars.VITE_ADMIN_PANEL_URL }}
            VITE_CLINIC_TZ=${{ vars.VITE_CLINIC_TZ }}
            VITE_SUPPORT_EMAIL=${{ vars.VITE_SUPPORT_EMAIL }}
            VITE_SUPPORT_PHONE=${{ vars.VITE_SUPPORT_PHONE }}
          tags: |
            ${{ env.REGISTRY }}/mindcare-frontend:stable
            ${{ env.REGISTRY }}/mindcare-frontend:${{ env.SHORT_SHA }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Admin / Doctor panel
        uses: docker/build-push-action@v6
        with:
          context: admin
          file: admin/Dockerfile
          push: true
          build-args: |
            VITE_BACKEND_URL=${{ vars.VITE_BACKEND_URL }}
            VITE_PATIENT_APP_URL=${{ vars.VITE_PATIENT_APP_URL }}
            VITE_CLINIC_TZ=${{ vars.VITE_CLINIC_TZ }}
          tags: |
            ${{ env.REGISTRY }}/mindcare-admin:stable
            ${{ env.REGISTRY }}/mindcare-admin:${{ env.SHORT_SHA }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=admin
          cache-to: type=gha,mode=max,scope=admin

      - name: Backend API
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/mindcare-backend:stable
            ${{ env.REGISTRY }}/mindcare-backend:${{ env.SHORT_SHA }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: MindAI chatbot
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile.ai
          push: true
          tags: |
            ${{ env.REGISTRY }}/mindcare-ai:stable
            ${{ env.REGISTRY }}/mindcare-ai:${{ env.SHORT_SHA }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=ai
          cache-to: type=gha,mode=max,scope=ai

      - name: Summary
        run: |
          {
            echo "### ✅ Published commit \`${SHORT_SHA}\` as \`:stable\`"
            echo ""
            echo "The home server will pull it within ~2 minutes (or on next boot)."
            echo ""
            echo "| Image | Tags |"
            echo "|---|---|"
            for s in frontend admin backend ai; do
              echo "| \`${REGISTRY}/mindcare-$s\` | \`stable\`, \`${SHORT_SHA}\` |"
            done
          } >> "$GITHUB_STEP_SUMMARY"
